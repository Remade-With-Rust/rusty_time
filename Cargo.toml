[workspace]
resolver = "2"
members = [
    "crates/rusty_time-core",
    "crates/rusty_time-nts",
    "crates/rusty_time-clock",
    "crates/rusty_time-api",
    "crates/rusty_time-daemon",
    "crates/rusty_time-ctl",
    "crates/rusty_time-wasm",
    "crates/rusty_time-alloc",
    "crates/rusty_time-sim",
]

# The on-board proof (bare-metal/esp32s3) is a firmware crate for Xtensa: it
# needs Espressif's Rust fork and its own linker script, so it must not be a
# workspace member. Excluded, a plain `cargo build` at the root never sees it.
exclude = ["bare-metal/esp32s3"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/remade-with-rust/rusty_time"
homepage = "https://www.mata.network/"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
rusty_time-core = { path = "crates/rusty_time-core", version = "0.2.0" }
rusty_time-nts = { path = "crates/rusty_time-nts", version = "0.2.0" }
rusty_time-clock = { path = "crates/rusty_time-clock", version = "0.2.0" }
rusty_time-api = { path = "crates/rusty_time-api", version = "0.2.0" }
rusty_time-alloc = { path = "crates/rusty_time-alloc", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# THE JSON SWAP (rusty_json_turbo). One line converts the WHOLE graph.
#
# `serde_json` here is the house fork, `Remade-With-Rust/rusty_json_turbo`: a
# performance fork of serde_json whose output is byte-identical to upstream's
# by contract, gated per commit against upstream linked in the same process --
# bytes, `Value`, error text with line and column, float bit patterns and
# `StreamDeserializer` offsets.
#
# It is a `[patch]` rather than a renamed dependency on purpose. Renaming
# `serde_json = { package = "rusty_json_turbo", ... }` would convert only the
# JSON this workspace writes itself and leave every third-party copy on
# upstream -- and the two would be DIFFERENT TYPES, so a `Value` crossing that
# boundary would not compile. Patching converts every copy at once, and there
# is then only one `Value` in the graph.
#
# The patch target is a shim package inside that repository named `serde_json`,
# which exists because `[patch]` matches on PACKAGE name and the fork's package
# is `rusty_json_turbo` (its LIBRARY is `serde_json`, so every `use
# serde_json::...` line in this workspace is untouched).
[patch.crates-io]
serde_json = { git = "https://github.com/Remade-With-Rust/rusty_json_turbo", branch = "master" }
