name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # M0 exit gate: cargo check green on all 8 shipping targets (mission plan §6.5).
  check-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo check --workspace --all-targets --target ${{ matrix.target }}
        if: ${{ !startsWith(matrix.target, 'wasm32') }}
      # wasm: bins (rtimed/rtimec/timecorp) are native-only; check the libraries.
      - run: cargo check -p rusty_time-core -p rusty_time-nts -p rusty_time-wasm -p rusty_time-api --target ${{ matrix.target }}
        if: ${{ startsWith(matrix.target, 'wasm32') }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # M3 gate: NTS interop against chrony, both directions. chrony must be built
  # with +NTS (needs gnutls + nettle), and clknetsim is not involved here.
  nts-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build chrony with NTS
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libgnutls28-dev nettle-dev pkg-config
          git clone --depth 1 https://gitlab.com/chrony/chrony ~/chrony
          cd ~/chrony && ./configure && make -j"$(nproc)"
          ./chronyd --version | grep -q '+NTS' || { echo "chrony lacks NTS"; exit 1; }
      - name: Build rtimed
        run: |
          CARGO_TARGET_DIR=~/rt-target cargo build --release -p rusty_time-daemon
      - name: Two-way NTS interop
        run: |
          # chronyd refuses to start unprivileged ("Fatal error : Not
          # superuser"), so without this direction B never gets off the ground
          # and direction A finds nothing listening on the NTS-KE port.
          sudo CHRONY_DIR="$HOME/chrony" RTIMED="$HOME/rt-target/release/rtimed" \
            bash tools/corpus/nts_interop_chrony.sh

  # M4 gate: chronyd must sync from us over plain NTP and in interleaved mode,
  # with sane offset and delay — not merely negotiate the mode.
  m4-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build chrony
        run: |
          sudo apt-get update
          sudo apt-get install -y bison
          git clone --depth 1 https://gitlab.com/chrony/chrony ~/chrony
          cd ~/chrony && ./configure && make -j"$(nproc)"
      - name: Build rtimed + rtimec
        run: CARGO_TARGET_DIR=~/rt-target cargo build --release -p rusty_time-daemon -p rusty_time-ctl
      - name: chronyd syncs from rusty_time (plain + interleaved)
        run: |
          sudo CHRONY_DIR="$HOME/chrony" RTIMED="$HOME/rt-target/release/rtimed" \
            RTIMEC="$HOME/rt-target/release/rtimec" \
            bash tools/corpus/m4_interop_chrony.sh

  # M5 gate: the smoke rig on every platform we ship, including macOS — the one
  # this project cannot run locally.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p rusty_time-daemon -p rusty_time-ctl
      - name: Smoke rig
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            RTIMED=./target/release/rtimed.exe RTIMEC=./target/release/rtimec.exe \
              bash tools/smoke/smoke.sh
          else
            RTIMED=./target/release/rtimed RTIMEC=./target/release/rtimec \
              bash tools/smoke/smoke.sh
          fi

  # M6 gate: build the real wasm module and run it against a real gateway.
  # Not a simulation — this is the browser path minus the browser.
  wasm-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build the npm package
        run: bash tools/wasm/build-npm.sh
      - name: Build rtimed
        run: cargo build --release -p rusty_time-daemon
      - name: wasm client against a live gateway
        run: |
          ./target/release/rtimed serve --stratum 1 --bind 127.0.0.1:8198 \
            --gateway 127.0.0.1:8199 --gateway-assets crates/rusty_time-wasm/pkg \
            --ratelimit-interval -4 --ratelimit-burst 64 --control ci-gw &
          sleep 3
          node tools/smoke/gateway_node_test.mjs http://127.0.0.1:8199 6

  # S12: deterministic server-load counts. Fast, and it has caught real
  # defects (see corpus/LEDGER.md).
  server-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --release -p rusty_time-sim -- serverload

  # G7: the parsers that face untrusted bytes. ~30 M executions locally at
  # 60s/target with zero crashes; CI re-runs it on every change.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the untrusted-input parsers
        run: SECONDS_PER_TARGET=60 bash tools/corpus/run_fuzzers.sh

  # M7: reference-clock transports. SHM and SOCK are driven by synthetic
  # producers so they need no GPS; PHC runs where a /dev/ptp* exists. PPS and
  # NIC hardware timestamping are reported as pending rather than skipped
  # silently.
  refclocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ethtool python3
      - run: cargo build --release -p rusty_time-daemon
      - name: Capability inventory
        run: bash tools/corpus/probe_hw_capabilities.sh
      - name: Reference clock transports
        run: RTIMED=./target/release/rtimed bash tools/corpus/refclock_probe.sh
